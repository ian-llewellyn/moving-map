<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>HSI</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="main">
    <canvas id="map"></canvas>

    <div id="menu-btn" class="corner" role="button" aria-label="Menu">&#8942;</div>
    <nav id="menu" hidden>
      <a href="airfields.html">Airfields</a>
      <a href="settings.html">Settings</a>
      <button id="debug-btn" type="button">Debug</button>
    </nav>

    <div id="banner" hidden>
      <span id="banner-text"></span>
      <button id="banner-btn" hidden>Retry</button>
    </div>

    <div id="debug" hidden>
      <div class="debug-head">
        <strong>DEBUG</strong>
        <span>
          <a class="debug-repo" href="https://github.com/ian-llewellyn/moving-map" target="_blank" rel="noopener noreferrer" title="Code on GitHub">
            <svg class="octicon" viewBox="0 0 16 16" width="12" height="12" aria-hidden="true" focusable="false">
              <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
            Code on GitHub
          </a>
          <span id="debug-copied" class="debug-copied"></span>
          <button id="debug-copy" type="button">Copy</button>
          <button id="debug-close" type="button">Close</button>
        </span>
      </div>
      <div id="debug-reason" class="debug-reason"></div>
      <table id="debug-body" class="debug-table"></table>
      <div class="debug-logtitle">Event log</div>
      <pre id="debug-log" class="debug-log"></pre>
    </div>

    <div id="start">
      <h1>HSI</h1>
      <button id="start-btn">Start</button>
      <p>
        <a href="airfields.html">Select target airfield</a> &middot;
        <a href="settings.html">Settings</a>
      </p>
      <p class="start-repo">
        <a href="https://github.com/ian-llewellyn/moving-map" target="_blank" rel="noopener noreferrer" title="Code on GitHub">
          <svg class="octicon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
            <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"></path>
          </svg>
          Code on GitHub
        </a>
      </p>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
